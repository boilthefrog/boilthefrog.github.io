name: Apple probe
on:
  workflow_dispatch:
    inputs:
      ladder:
        default: bond
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/apple-wikidata.mjs ${{ inputs.ladder }}
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
